<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mounticks</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="Home.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header class="header">
            <button class="icon-btn" onclick="showMessage()">
                <img src="7.png" class="img-header" />
            </button>
        
           <div class="profile"> 

    <span class="user-icon"> 
        <img src="8.png" class="img-profil"/>
    </span> 

    <span id="homeUsername">
        User
    </span>

</div>
        </header>


        <!-- HERO -->
        <section class="hero">

            <div class="hero-content">
                <h1>
                    Selamat datang, di<br>
                    <span>Mounticks.</span>
                </h1>
            </div>

        </section>


        <!-- GREEN CURVE -->
        <div class="green-curve"></div>


        <!-- MENU CARD -->
        <section class="menu-card">

           <h2>
    Hai <span id="homeGreeting">User</span>, mau kemana?
</h2>

            <div class="menu-container">

    <a href="tiket.html" class="menu-item">
        <div class="menu-icon">
            <img src="1.png">
        </div>
        <span>Tiket</span>
    </a>

    <a href="camping.html" class="menu-item">
        <div class="menu-icon">
            <img src="3.png" alt="">
        </div>
        <span>Camping Spot</span>
    </a>

    <a href="riwayat.html" class="menu-item">
        <div class="menu-icon">
            <img src="6.png" alt="">
        </div>
        <span>Riwayat</span>
    </a>

    <a href="berita.html" class="menu-item">
        <div class="menu-icon">
            <img src="5.png" alt="">
        </div>
        <span>Berita Gunung</span>
    </a>

    <a href="jadwal.html" class="menu-item">
        <div class="menu-icon">
            <img src="4.png" alt="">
        </div>
        <span>Jadwal</span>
    </a>

</div>

        </section>

    </div>

    <script src="script.js"></script>
    <script src="data.js"></script>

<!-- ==============================
     MODAL PENGATURAN
================================= -->

<div class="settings-overlay" id="settingsOverlay">

    <div class="settings-modal">

        <button
            class="settings-close"
            onclick="closeSettings()">
            ×
        </button>

        <div class="settings-icon">
            ⚙
        </div>

        <h2>Pengaturan</h2>

        <p class="settings-subtitle">
            Kelola akun dan pengaturan Mounticks
        </p>


        <!-- AKUN -->

        <div class="settings-account">

            <div class="settings-avatar">
                👤
            </div>

            <div>
                <strong id="settingsUsername">
                    User
                </strong>

                <span id="settingsEmail">
                    user@email.com
                </span>
            </div>

        </div>


        <!-- PILIHAN -->

        <div class="settings-menu">

            <button
                class="settings-item"
                onclick="showAccountInfo()">

                <span>👤</span>

                <div>
                    <strong>Akun Saya</strong>
                    <small>Lihat informasi akun</small>
                </div>

                <b>›</b>

            </button>


            <button
                class="settings-item"
                onclick="showMessage('Fitur tema akan segera tersedia')">

                <span>🎨</span>

                <div>
                    <strong>Tampilan</strong>
                    <small>Pengaturan tampilan</small>
                </div>

                <b>›</b>

            </button>


            <button
                class="settings-item"
                onclick="showMessage('Mounticks versi demo')">

                <span>ℹ️</span>

                <div>
                    <strong>Tentang Mounticks</strong>
                    <small>Informasi aplikasi</small>
                </div>

                <b>›</b>

            </button>

        </div>


        <!-- LOGOUT -->

        <button
            class="logout-btn"
            onclick="logout()">

            Keluar dari Akun

        </button>

    </div>

</div>
</body>
</html>
