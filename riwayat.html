<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Riwayat Booking - Mounticks</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Belleza&family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="riwayat.css">

</head>


<body>

<div class="page">


    <!-- HEADER -->

    <header class="header">

        <a href="Home.html" class="back-btn">
            ←
        </a>

        <h1>
            Riwayat Booking
        </h1>

        <div class="header-space"></div>

    </header>


    <!-- HERO -->

    <section class="hero">

        <span class="line"></span>

        <h2>
            Perjalanan<br>
            <em>kamu.</em>
        </h2>

        <p>
            Semua booking pendakian yang pernah kamu buat
            tersimpan di sini.
        </p>

    </section>


    <!-- LIST -->

    <main
        class="booking-list"
        id="bookingList">

    </main>


    <!-- EMPTY -->

    <div
        class="empty"
        id="empty">

        <div class="empty-icon">
            🎟
        </div>

        <h3>
            Belum ada booking
        </h3>

        <p>
            Booking pendakian pertamamu
            akan muncul di sini.
        </p>

        <a
            href="tiket.html"
            class="book-btn">

            Booking Sekarang

        </a>

    </div>


</div>


<script src="riwayat.js"></script>

</body>

</html>
